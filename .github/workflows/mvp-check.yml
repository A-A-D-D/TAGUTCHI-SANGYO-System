name: MVP Check

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - chore/mvp-roadmap-ui-foundation

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm install --ignore-scripts

      - name: Build order UI
        run: npm run build:order-ui

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, gd
          tools: composer:v2

      - name: Validate MVP Composer definition
        working-directory: wp-content/mu-plugins/taguchi-order-mvp
        run: composer validate --no-check-lock

      - name: Install mPDF dependency
        working-directory: wp-content/mu-plugins/taguchi-order-mvp
        run: composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          php -l wp-content/mu-plugins/taguchi-order-mvp.php
          php -l wp-content/mu-plugins/taguchi-order-mvp/bootstrap.php
          php -l wp-content/themes/taguchi_system/page-purchase-order.php

      - name: Commit deterministic build inputs and artifact
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json \
            wp-content/mu-plugins/taguchi-order-mvp/composer.lock \
            wp-content/themes/taguchi_system/assets/css/order-ui.css
          if git diff --cached --quiet; then
            echo "No lock/build changes"
          else
            git commit -m "chore: lock MVP dependencies and UI build [skip ci]"
            git push
          fi
